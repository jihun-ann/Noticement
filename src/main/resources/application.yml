app:
  timezone: Asia/Seoul

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/noticement
    username: noticement
    password: noticement
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

harness:
  crawl:
    blockPrivateNetwork: true
    maxRedirects: 3
    connectTimeoutMs: 3000
    readTimeoutMs: 10000
    maxBodyBytes: 5242880
    allowedSchemes:
      - https
      - http
    allowedContentTypes:
      - text/html
      - application/json
      - application/xml
      - text/xml
      - text/plain
      - application/pdf

  ai:
    prompt-injection:
      suspiciousPhrases:
        - "ignore previous instructions"
        - "ignore all previous instructions"
        - "disregard previous instructions"
        - "call this api"
        - "send credentials"
        - "send your credentials"
        - "write this secret"
        - "you are now"
        - "new instructions:"
        - "system prompt"
    schema:
      maxSummaryLength: 2000
      maxActionItems: 10
    evidence:
      requireEvidenceForSecurityIssues: true
      requireEvidenceForBreakingChanges: true
    confidence:
      reviewBelow: 0.5
      blockBelow: 0.2

  notion:
    allowedDatabaseIds:
      - ${NOTION_DATABASE_ID:}
    maxTitleLength: 200
    maxPayloadBytes: 200000
    maxBlockCount: 90
    secretPatterns:
      - "AKIA[0-9A-Z]{16}"
      - "-----BEGIN (RSA |EC |)PRIVATE KEY-----"
      - "sk-[A-Za-z0-9]{20,}"

notion:
  apiBaseUrl: https://api.notion.com/v1
  apiVersion: "2022-06-28"
  apiKey: ${NOTION_API_KEY:}
  databaseId: ${NOTION_DATABASE_ID:}
  timeoutMs: 15000

llm:
  timeoutMs: 30000
  analysis:
    provider: openai
    baseUrl: https://api.openai.com/v1
    apiKey: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
  weekly:
    provider: openai
    baseUrl: https://api.openai.com/v1
    apiKey: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
